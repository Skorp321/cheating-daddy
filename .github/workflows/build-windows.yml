name: Build Windows .exe

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and app
        run: npm run make

      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: cheating-daddy-windows
          path: |
            out/make/**/*.exe
            out/**/Cheating Daddy.exe
          if-no-files-found: error
